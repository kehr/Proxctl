name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Smoke test
        run: |
          ./build/proxctl version
          ./build/proxctl --help
          ./build/proxctl client list

      - name: Check generated command docs
        run: |
          rm -rf docs/commands
          ./build/proxctl docs docs/commands
          git diff --exit-code -- docs/commands

  snapshot:
    name: Snapshot Artifacts
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Build snapshot archives
        run: make snapshot

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proxctl-snapshot-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

