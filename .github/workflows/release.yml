name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          ./scripts/version.sh tag-check "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build release archives
        run: make dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Proxctl ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            dist/proxctl-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/proxctl-${{ steps.version.outputs.version }}-linux-arm64.tar.gz
            dist/proxctl-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz
            dist/proxctl-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz
            dist/proxctl-${{ steps.version.outputs.version }}-windows-amd64.zip
            dist/checksums.txt
